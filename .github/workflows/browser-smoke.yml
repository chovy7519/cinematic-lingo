name: Browser interaction smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser tooling (not a runtime dependency)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 5173 --bind 127.0.0.1 > /tmp/cinematic-server.log 2>&1 &
      - name: Exercise dictionary and camera lab in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-v03-browser-preview
          path: |
            /tmp/cinematic-dictionary-v03.png
            /tmp/cinematic-lab-v03.png
          if-no-files-found: ignore
